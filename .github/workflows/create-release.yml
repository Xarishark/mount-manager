name: Build AppImage and Release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read version
        id: metadata
        run: |
          set -euo pipefail
          version=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("data/metainfo/io.github.xarishark.mount-manager.metainfo.xml").find("releases/release").get("version", ""))')
          if [[ ! "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "Invalid version in AppStream metadata: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=SMB-Mount-Manager-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync

      - name: Build AppImage
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          packaging/build-appimage.sh
          test -s "dist/SMB-Mount-Manager-${VERSION}-x86_64.AppImage"
          test -s "dist/SMB-Mount-Manager-${VERSION}-x86_64.AppImage.zsync"
          cd dist
          sha256sum -c "SMB-Mount-Manager-${VERSION}-x86_64.AppImage.sha256"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.AppImage.zsync
          if-no-files-found: error
          compression-level: 0

  create_release:
    name: Publish version bump
    needs: build_appimage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build_appimage.outputs.version }}
      BEFORE_SHA: ${{ github.event.before }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version bump
        id: version_check
        run: |
          set -euo pipefail
          manifest=data/metainfo/io.github.xarishark.mount-manager.metainfo.xml
          previous_version=
          if [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            previous_version=$(git show "$BEFORE_SHA:$manifest" | python3 -c 'import sys, xml.etree.ElementTree as ET; print(ET.parse(sys.stdin).find("releases/release").get("version", ""))')
          fi
          latest_tag=$(git tag --list 'v[0-9]*' --sort=-version:refname | sed -n '1p')
          latest_version=${latest_tag#v}

          for baseline in "$previous_version" "$latest_version"; do
            if [ -z "$baseline" ]; then
              continue
            fi
            highest=$(printf '%s\n' "$baseline" "$VERSION" | sort -V | tail -n1)
            if [ "$VERSION" = "$baseline" ] || [ "$VERSION" != "$highest" ]; then
              echo "Version $VERSION is not newer than $baseline; skipping release."
              exit 0
            fi
          done
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Download built AppImage
        if: steps.version_check.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_appimage.outputs.artifact_name }}
          path: dist

      - name: Create release
        if: steps.version_check.outputs.release == 'true'
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          cd dist
          APPIMAGE="SMB-Mount-Manager-${VERSION}-x86_64.AppImage"
          test -s "$APPIMAGE"
          test -s "$APPIMAGE.zsync"
          sha256sum -c "$APPIMAGE.sha256"
          gh release create "v${VERSION}" \
            "$APPIMAGE" "$APPIMAGE.sha256" "$APPIMAGE.zsync" \
            --title "v${VERSION}" \
            --generate-notes \
            --target "$GITHUB_SHA"
